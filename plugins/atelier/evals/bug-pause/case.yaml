schema_version: "1.1"
name: bug-pause
description: Un bug produit réel (la pause ne change aucune heure) se livre par livrer, test rouge avant le code, task list livrable.
tags: [livrer, lourd]
runs: 2
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 150
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill, Agent, TodoWrite]
  prompt: |
    bug: les heures vendables ne retirent pas la pause de midi. Ouvert 9h–12h puis 14h–19h, l'écran affiche 10 h au lieu de 8 h. Corrige-le, le dépôt est dans le dossier courant.
